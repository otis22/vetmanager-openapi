<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Изменения API по релизам — VetManager</title>
  <link rel="stylesheet" href="./dist/swagger-custom.css">
</head>
<body class="faq-page">
  <nav class="docs-nav" aria-label="Документация"><a class="docs-brand" href="./index.html">VetManager API</a><a class="docs-back" href="./index.html">← Вернуться к Swagger</a></nav>
  <main class="faq-content">
    <h1>Изменения API по релизам</h1>
    <div id="history" aria-live="polite">Загрузка…</div>
  </main>
  <script>
    async function loadHistory() {
      const history = document.getElementById("history");
      try {
        const response = await fetch("./api-releases.json", {cache: "no-cache"});
        if (!response.ok) throw new Error("history unavailable");
        const releases = Object.entries(await response.json());
        releases.sort(([a], [b]) => b.localeCompare(a, "en", {numeric: true}));
        history.textContent = releases.length ? "" : "Пока нет опубликованных релизов.";
        for (const [version, notes] of releases) {
          const section = document.createElement("section");
          section.className = "faq-card";
          const heading = document.createElement("h2");
          heading.textContent = "Релиз " + version;
          section.append(heading);
          const list = document.createElement("ul");
          for (const note of notes) {
            const item = document.createElement("li");
            item.style.whiteSpace = "pre-wrap";
            item.textContent = note;
            list.append(item);
          }
          section.append(notes.length ? list : "Изменений API не заявлено.");
          history.append(section);
        }
      } catch {
        history.textContent = "Не удалось загрузить историю релизов. Обновите страницу.";
      }
    }
    loadHistory();
  </script>
</body>
</html>
